<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --peach-bg-1:#FFD9B8;
    --peach-bg-2:#FFC79A;
    --peach-deep:#FF8A5B;
    --peach-mid:#FFB088;
    --coral:#FF6F47;
    --coral-dark:#E5532B;
    --leaf:#7FAE6E;
    --white:#FFFFFF;
    --ink:#4A2F22;
    --ink-soft:#8A6A56;
    --card-shadow: 0 10px 30px rgba(180,90,40,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito Sans',sans-serif;color:var(--ink);}
  h1,h2,h3,.brand-font{font-family:'Baloo 2',cursive;}
  html,body{height:100%;margin:0;}
  #app{height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(160deg,var(--peach-bg-1),var(--peach-bg-2));display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  ::placeholder{color:#C99A7E;}

  /* ---------- Landing / Sign in ---------- */
  .landing{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .auth-card{background:var(--white);border-radius:24px;box-shadow:var(--card-shadow);padding:40px 36px;max-width:400px;width:100%;text-align:center;}
  .logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-title{font-size:32px;font-weight:700;color:var(--coral-dark);margin:0;}
  .brand-tag{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}
  .field{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #F0DCC8;background:#FFF8F1;font-size:14px;margin-bottom:12px;outline:none;}
  .field:focus{border-color:var(--peach-deep);}
  .btn-primary{width:100%;padding:12px;border-radius:12px;border:none;background:var(--coral);color:white;font-weight:700;font-size:15px;margin-top:4px;transition:transform .1s, background .15s;}
  .btn-primary:hover{background:var(--coral-dark);}
  .btn-primary:active{transform:scale(0.98);}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;margin:18px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#F0DCC8;}
  .btn-social{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:12px;border:1.5px solid #F0DCC8;background:white;font-weight:600;font-size:14px;color:var(--ink);margin-bottom:10px;}
  .btn-social:hover{background:#FFF3E8;}
  .small-note{font-size:11.5px;color:#B79680;margin-top:14px;line-height:1.5;}

  .auth-msg{min-height:18px;font-size:12.5px;color:var(--coral-dark);margin:10px 0 2px;line-height:1.4;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;margin-bottom:2px;padding:4px;}
  .signout{margin-left:auto;background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;}
  .pay-note{background:#FFF3E8;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-soft);margin:6px 0 16px;line-height:1.5;}
  .loading-screen{flex:1;display:flex;align-items:center;justify-content:center;}
  /* ---------- App shell ---------- */
  .shell{flex:1;display:flex;min-height:0;height:100%;}
  .sidebar{width:260px;background:rgba(255,255,255,0.55);backdrop-filter:blur(6px);display:flex;flex-direction:column;padding:18px 14px;border-right:1.5px solid rgba(255,255,255,0.6);}
  .sb-logo{display:flex;align-items:center;gap:8px;padding:6px 6px 16px;}
  .sb-logo span{font-size:20px;font-weight:700;color:var(--coral-dark);}
  .new-chat-btn{width:100%;padding:10px;border-radius:12px;border:none;background:var(--coral);color:white;font-weight:700;font-size:13.5px;margin-bottom:14px;}
  .new-chat-btn:hover{background:var(--coral-dark);}
  .sb-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:10px 6px 6px;font-weight:700;}
  .project-item{padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--ink);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .project-item:hover{background:rgba(255,255,255,0.7);}
  .project-item.active{background:white;font-weight:700;}
  .sidebar-bottom{margin-top:auto;}
  .plan-card{background:white;border-radius:14px;padding:12px;font-size:12.5px;margin-bottom:10px;}
  .plan-card b{color:var(--coral-dark);}
  .upgrade-btn{width:100%;padding:9px;border-radius:10px;border:none;background:var(--ink);color:white;font-weight:700;font-size:12.5px;margin-top:8px;}
  .user-row{display:flex;align-items:center;gap:8px;padding:8px 6px;background:white;border-radius:12px;font-size:13px;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--peach-mid);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:12px;flex-shrink:0;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;}
  .topbar-title{font-weight:700;font-size:15px;color:var(--ink);}
  .mode-tabs{display:flex;gap:6px;background:rgba(255,255,255,0.6);border-radius:12px;padding:4px;}
  .mode-tab{padding:7px 14px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .mode-tab.active{background:white;color:var(--coral-dark);}

  .chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 24px 20px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:70%;padding:13px 16px;border-radius:16px;font-size:14.5px;line-height:1.55;}
  .msg.user{align-self:flex-end;background:var(--coral);color:white;border-bottom-right-radius:4px;}
  .msg.ai{align-self:flex-start;background:white;color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 3px 10px rgba(180,90,40,0.08);}
  .msg.ai pre{background:#FFF3E8;padding:10px;border-radius:8px;overflow-x:auto;font-size:12.5px;}
  .msg img.gen-svg{max-width:280px;border-radius:10px;background:#fff;}
  .empty-hero{margin:auto;text-align:center;color:var(--ink-soft);}
  .empty-hero h2{color:var(--coral-dark);margin-bottom:6px;}

  .composer{padding:14px 24px 22px;}
  .composer-inner{background:white;border-radius:18px;box-shadow:var(--card-shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  .composer-tools{display:flex;gap:6px;}
  .tool-chip{border:1.5px solid #F0DCC8;background:#FFF8F1;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
  .tool-chip.locked{opacity:.65;}
  .tool-chip.on{background:var(--coral);border-color:var(--coral);color:white;}
  .composer-row{display:flex;align-items:flex-end;gap:8px;}
  .composer-row textarea{flex:1;border:none;resize:none;outline:none;font-family:inherit;font-size:14.5px;max-height:120px;padding:6px;}
  .send-btn{background:var(--coral);border:none;color:white;width:38px;height:38px;border-radius:50%;flex-shrink:0;font-size:16px;}
  .send-btn:hover{background:var(--coral-dark);}
  .typing{align-self:flex-start;color:var(--ink-soft);font-size:13px;padding-left:4px;}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(70,40,20,0.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--peach-bg-1);border-radius:22px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:30px;}
  .modal-close{float:right;background:white;border:none;border-radius:50%;width:30px;height:30px;font-size:15px;}
  .tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
  .tier-card{background:white;border-radius:16px;padding:18px;border:2px solid transparent;}
  .tier-card.featured{border-color:var(--coral);}
  .tier-card h3{margin:0 0 2px;color:var(--coral-dark);}
  .tier-price{font-size:22px;font-weight:800;margin:6px 0;}
  .tier-price span{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .tier-card ul{padding-left:18px;font-size:12.5px;color:var(--ink-soft);margin:10px 0;}
  .tier-select{width:100%;padding:9px;border-radius:10px;border:none;background:#FFF3E8;color:var(--coral-dark);font-weight:700;font-size:13px;}
  .tier-select.chosen{background:var(--coral);color:white;}
  .pay-methods{display:flex;gap:10px;margin:16px 0;}
  .pay-method{flex:1;padding:12px;border-radius:12px;border:1.5px solid #F0DCC8;background:white;text-align:center;font-weight:700;font-size:13px;}
  .pay-method.chosen{border-color:var(--coral);background:#FFF3E8;color:var(--coral-dark);}
  .card-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .card-form input{grid-column:span 2;}
  .card-form input.half{grid-column:span 1;}
  .disclaimer{background:#FFF3E8;border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:60;}

  .menu-btn,.sb-backdrop{display:none;}
  html{-webkit-text-size-adjust:100%;}
  textarea,input{font-size:16px;}
  @media (max-width:760px){
    .sidebar{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:300px;z-index:40;transform:translateX(-105%);transition:transform .22s ease;background:#FFF1E6;box-shadow:6px 0 24px rgba(120,60,20,.18);overflow-y:auto;}
    .shell.menu-open .sidebar{transform:translateX(0);}
    .shell.menu-open .sb-backdrop{display:block;position:fixed;inset:0;background:rgba(70,40,20,.35);z-index:30;}
    .menu-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.75);font-size:18px;color:var(--coral-dark);flex-shrink:0;}
    .topbar{padding:10px 12px;gap:8px;}
    .topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
    .topbar-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .mode-tab{padding:7px 10px;font-size:12.5px;}
    .chat-scroll{padding:8px 12px 14px;}
    .msg{max-width:90%;}
    .msg img.gen-svg{max-width:100%;}
    .composer{padding:8px 12px calc(12px + env(safe-area-inset-bottom));}
    .tool-chip{padding:5px 10px;}
    .modal{padding:20px 16px;border-radius:18px;}
    .tier-grid{grid-template-columns:1fr;}
    .pay-methods{flex-direction:column;}
    .landing{padding:20px 14px;}
  }
  @media (max-width:420px){
    .mode-tabs{gap:2px;padding:3px;}
    .mode-tab{padding:6px 8px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
// Supabase connection. Both values below are meant to be public in a website.
// Never put the Secret key (sb_secret_...) in this file.
const SUPABASE_URL = 'https://vccxfwvgwztvboosydvt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lDJKgrlkUNS5B8FtdW01sQ_XjRFhPj4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Escapes text so it can sit safely inside an HTML attribute (used for the sandboxed animation frame).
function attrEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const PEACH_LOGO = (size) => `
<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="peachBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC08A"/>
      <stop offset="55%" stop-color="#FF9A66"/>
      <stop offset="100%" stop-color="#FF7A50"/>
    </linearGradient>
  </defs>
  <path d="M50 20c14 0 26 12 26 32 0 21-14 32-26 32S24 73 24 52c0-20 12-32 26-32z" fill="url(#peachBody)"/>
  <path d="M50 20c-3 6-3 13 0 18" stroke="#E85D3A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="38" cy="40" rx="7" ry="10" fill="#FFD9B8" opacity="0.55"/>
  <path d="M50 20c1-6 6-10 13-10" stroke="#8A5A2E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M58 12c6-4 13-3 16 2 -6 3-13 2-16-2z" fill="#7FAE6E"/>
</svg>`;

let state = {
  screen: 'loading',
  authMode: 'signin',
  authMessage: '',
  user: null,
  projects: [],
  currentProjectId: null,
  mode: 'chat',
  loading: false,
  showMembershipModal: false,
  selectedTier: 'pro',
  selectedPayment: 'card',
  toast: null
};

const TIERS = [
  {id:'starter', name:'Starter', price:15, features:['Image and animation generation','150 messages a day','Chats saved to your account','Code help for games and websites']},
  {id:'pro', name:'Pro', price:29, features:['Everything in Starter','400 messages a day']},
  {id:'ultra', name:'Ultra', price:49, features:['Everything in Pro','1,000 messages a day']}
];

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'loading'){ app.innerHTML = `<div class="loading-screen">${PEACH_LOGO(72)}</div>`; return; }
  if(state.screen === 'landing'){ app.innerHTML = renderLanding(); attachLandingEvents(); return; }
  app.innerHTML = renderShell();
  attachShellEvents();
  if(state.showMembershipModal){
    document.body.insertAdjacentHTML('beforeend', renderMembershipModal());
    attachModalEvents();
  }
  if(state.toast){
    document.body.insertAdjacentHTML('beforeend', `<div class="toast">${escapeHtml(state.toast)}</div>`);
    setTimeout(()=>{ state.toast=null; document.querySelector('.toast')?.remove(); }, 2600);
  }
}

/* ---------------- LANDING / AUTH ---------------- */
function renderLanding(){
  const signup = state.authMode === 'signup';
  return `
  <div class="landing">
    <div class="auth-card">
      <div class="logo-wrap">
        ${PEACH_LOGO(64)}
        <h1 class="brand-title">Peacho</h1>
      </div>
      <p class="brand-tag">Cool, cultured, and always in your corner.</p>
      ${signup ? '<input class="field" id="nameInput" placeholder="Your name" autocomplete="name" />' : ''}
      <input class="field" id="emailInput" placeholder="name@example.com" type="email" autocomplete="email" />
      <input class="field" id="passwordInput" placeholder="Password, 8 characters or more" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" />
      <button class="btn-primary" id="emailSignIn">${signup ? 'Create account' : 'Sign in'}</button>
      <p class="auth-msg" id="authMsg" role="status">${escapeHtml(state.authMessage || '')}</p>
      <button class="link-btn" id="toggleAuth">${signup ? 'Have an account? Sign in' : 'New to Peacho? Create an account'}</button>
      ${state.user ? '<button class="link-btn" id="backToChat">Back to chat</button>' : ''}
      <p class="small-note">You don\u2019t need an account to chat. An account keeps your chats on every device and lets you subscribe. Plans start at $15/mo.</p>
    </div>
  </div>`;
}

function setAuthMsg(text){
  state.authMessage = text;
  const el = document.getElementById('authMsg');
  if(el) el.textContent = text;
}

function attachLandingEvents(){
  document.getElementById('toggleAuth').onclick = ()=>{
    state.authMode = state.authMode === 'signup' ? 'signin' : 'signup';
    state.authMessage = '';
    render();
  };
  const submit = async ()=>{
    const signup = state.authMode === 'signup';
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const nameEl = document.getElementById('nameInput');
    const name = nameEl ? nameEl.value.trim() : '';
    if(!email || !password){ setAuthMsg('Enter your email and password.'); return; }
    if(signup && password.length < 8){ setAuthMsg('Use at least 8 characters for your password.'); return; }
    const btn = document.getElementById('emailSignIn');
    btn.disabled = true;
    setAuthMsg('');
    try{
      if(signup){
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { full_name: name || email.split('@')[0] }, emailRedirectTo: window.location.origin }
        });
        if(error) throw error;
        if(!data.session){
          state.authMode = 'signin';
          setAuthMsg('Check your email to confirm your account, then sign in.');
          render();
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
    }catch(e){
      const m = (e && e.message) || 'Something went wrong. Try again.';
      if(/invalid login/i.test(m)) setAuthMsg('That email and password don’t match.');
      else if(/not confirmed/i.test(m)) setAuthMsg('Confirm your email first. Check your inbox for the link.');
      else if(/already registered/i.test(m)) setAuthMsg('That email already has an account. Sign in instead.');
      else setAuthMsg(m);
      btn.disabled = false;
    }
  };
  document.getElementById('emailSignIn').onclick = submit;
  document.getElementById('passwordInput').onkeydown = (e)=>{ if(e.key === 'Enter') submit(); };

  const back = document.getElementById('backToChat');
  if(back) back.onclick = ()=>{ state.screen = 'app'; state.authMessage = ''; render(); };
}

// Shows the sign-in screen, optionally with a message explaining why.
function goToAuth(message, mode){
  state.authMode = mode || 'signin';
  state.authMessage = message || '';
  state.showMembershipModal = false;
  state.screen = 'landing';
  render();
}

// Starts a guest session so chat works with no sign-in.
async function startGuest(){
  state.screen = 'loading';
  render();
  const { error } = await sb.auth.signInAnonymously();
  if(error){
    console.error('Peacho guest error:', error);
    goToAuth('Guest chat isn\u2019t available right now. Sign in or create an account to continue.', 'signin');
  }
}

/* ---------------- APP SHELL ---------------- */
function currentProject(){ return state.projects.find(p=>p.id===state.currentProjectId); }

function renderShell(){
  const proj = currentProject();
  const tierLabel = state.user.tier ? TIERS.find(t=>t.id===state.user.tier).name : 'Free';
  return `
  <div class="shell" id="shell">
    <div class="sb-backdrop" id="sbBackdrop"></div>
    <div class="sidebar">
      <div class="sb-logo">${PEACH_LOGO(28)}<span>Peacho</span></div>
      <button class="new-chat-btn" id="newChatBtn">+ New chat</button>
      <div class="sb-section-label">Your projects</div>
      <div style="flex:1;overflow-y:auto;">
        ${state.projects.map(p=>`<div class="project-item ${p.id===state.currentProjectId?'active':''}" data-id="${p.id}">${escapeHtml(p.title)}</div>`).join('')}
      </div>
      <div class="sidebar-bottom">
        <div class="plan-card">${state.user.guest ? `You\u2019re chatting as a <b>guest</b>. Images, animation and code are free. Create a free account to keep your chats on every device and get more each day.` : `Chat, code, images and animation are all <b>free</b> here. Daily limits keep Peacho running for everyone.`}
          ${state.user.guest ? `<button class="upgrade-btn" id="upgradeBtn">Sign in or create account</button>` : ''}
          <button class="upgrade-btn" id="testConnBtn" style="background:white;color:var(--coral-dark);border:1.5px solid #F0DCC8;margin-top:6px;">Test AI connection</button>
        </div>
        <div class="user-row"><div class="avatar">${(state.user.name||'?')[0].toUpperCase()}</div><div>${escapeHtml(state.user.name)}</div>${state.user.guest ? '' : '<button class="signout" id="signOutBtn">Sign out</button>'}</div>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="topbar-left"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><div class="topbar-title">${proj?escapeHtml(proj.title):'New chat'}</div></div>
        <div class="mode-tabs">
          <button class="mode-tab ${state.mode==='chat'?'active':''}" data-mode="chat">Chat</button>
          <button class="mode-tab ${state.mode==='image'?'active':''}" data-mode="image">Image</button>
          <button class="mode-tab ${state.mode==='video'?'active':''}" data-mode="video">Animate</button>
        </div>
      </div>
      <div class="chat-scroll" id="chatScroll">
        ${proj && proj.messages.length ? proj.messages.map(renderMsg).join('') : renderEmptyHero()}
        ${state.loading ? `<div class="typing">Peacho is thinking…</div>` : ''}
      </div>
      <div class="composer">
        <div class="composer-inner">
          <div class="composer-tools">
            <button class="tool-chip ${state.mode==='image'?'on':''}" data-mode="image">🎨 Image</button>
            <button class="tool-chip ${state.mode==='video'?'on':''}" data-mode="video">✨ Animate</button>
            <button class="tool-chip ${state.mode==='code'?'on':''}" data-mode="code">&lt;/&gt; Code</button>
          </div>
          <div class="composer-row">
            <textarea id="composerInput" rows="1" placeholder="${placeholderFor(state.mode)}"></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function lockIcon(){ return '<span style="font-size:11px;">🔒</span>'; }
function placeholderFor(mode){
  if(mode==='image') return 'Describe the image you want Peacho to create...';
  if(mode==='video') return 'Describe the short animated scene you want...';
  if(mode==='code') return 'Describe the game, site, or script you need built...';
  return 'Ask Peacho anything...';
}

function renderEmptyHero(){
  return `<div class="empty-hero"><h2>Hey ${escapeHtml(state.user.name)}, what are we making today?</h2><p>Chat, brainstorm, get advice, or build something — I remember our projects as we go.</p></div>`;
}

function renderMsg(m){
  // Generated images are shown as <img> (scripts can't run inside an image) and
  // animations in a sandboxed frame with scripts disabled.
  if(m.type==='svg'){
    return `<div class="msg ${m.role}"><div>${escapeHtml(m.text||'')}</div><div style="margin-top:8px;"><img class="gen-svg" alt="Generated image" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(m.content||'')}"></div></div>`;
  }
  if(m.type==='anim'){
    return `<div class="msg ${m.role}"><div>${escapeHtml(m.text||'')}</div><div style="margin-top:8px;"><iframe sandbox title="Generated animation" style="width:320px;max-width:100%;height:320px;border:0;border-radius:10px;background:#fff;" srcdoc="${attrEsc(m.content||'')}"></iframe></div></div>`;
  }
  return `<div class="msg ${m.role}">${formatText(m.text)}</div>`;
}

function formatText(t){
  let out = escapeHtml(t);
  out = out.replace(/```([\s\S]*?)```/g, (_,c)=>`<pre>${c.trim()}</pre>`);
  out = out.replace(/\n/g,'<br>');
  return out;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

function newLocalProject(){
  const p = { id: crypto.randomUUID(), title:'New chat', messages:[], updatedAt: Date.now() };
  state.projects.unshift(p);
  state.currentProjectId = p.id;
  return p;
}
// A new chat only exists on screen until the first message is sent, then it is saved to your account.
async function createNewProject(){ newLocalProject(); }

async function saveProject(p){
  const { error } = await sb.from('projects').upsert({
    id: p.id, title: p.title, messages: p.messages, updated_at: new Date().toISOString()
  });
  if(error){
    console.error('Peacho save error:', error);
    state.toast = 'Couldn\u2019t save this chat. Check your connection.';
  }
}

async function loadProfile(){
  const { data } = await sb.from('profiles').select('tier').eq('user_id', state.user.id).maybeSingle();
  state.user.tier = data ? data.tier : null;
}

async function loadProjects(){
  const { data, error } = await sb.from('projects').select('id,title,messages,updated_at').order('updated_at', { ascending: false });
  if(error){ console.error('Peacho load error:', error); }
  state.projects = (data || []).map(r=>({ id: r.id, title: r.title, messages: r.messages || [], updatedAt: r.updated_at }));
  if(state.projects.length === 0){ newLocalProject(); } else { state.currentProjectId = state.projects[0].id; }
}

async function enterApp(session){
  const u = session.user;
  const meta = u.user_metadata || {};
  const guest = u.is_anonymous === true;
  state.user = { id: u.id, email: u.email, guest, name: guest ? 'Guest' : (meta.full_name || meta.name || (u.email || 'Friend').split('@')[0]), tier: null };
  if(!guest){ await loadProfile(); }
  await loadProjects();
  state.screen = 'app';
}

function attachShellEvents(){
  const shellEl = document.getElementById('shell');
  document.getElementById('menuBtn').onclick = ()=>shellEl.classList.toggle('menu-open');
  document.getElementById('sbBackdrop').onclick = ()=>shellEl.classList.remove('menu-open');
  document.getElementById('newChatBtn').onclick = async ()=>{ await createNewProject(); render(); };
  document.querySelectorAll('.project-item').forEach(el=>{
    el.onclick = ()=>{ state.currentProjectId = el.dataset.id; render(); };
  });
  document.querySelectorAll('[data-mode]').forEach(el=>{
    el.onclick = ()=>{ state.mode = el.dataset.mode; render(); };
  });
  const so = document.getElementById('signOutBtn');
  if(so) so.onclick = async ()=>{ await sb.auth.signOut(); };
  const upBtn = document.getElementById('upgradeBtn');
  if(upBtn) upBtn.onclick = ()=>{ goToAuth('Create a free account to keep your chats on every device and get more each day.', 'signup'); };
  document.getElementById('testConnBtn').onclick = async ()=>{
    state.toast = 'Testing connection...';
    render();
    try{
      const reply = await callClaude([{role:'user', content:'Reply with exactly: connection ok'}], 'You are a test endpoint.', 20, 'chat');
      state.toast = 'Success — API replied: "' + reply.trim() + '"';
    }catch(e){
      console.error('Peacho test error:', e);
      state.toast = 'Failed — ' + (e && e.message ? e.message : String(e));
    }
    render();
  };
  const sendBtn = document.getElementById('sendBtn');
  const input = document.getElementById('composerInput');
  sendBtn.onclick = ()=>handleSend();
  input.onkeydown = (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } };
  const scroll = document.getElementById('chatScroll');
  if(scroll) scroll.scrollTop = scroll.scrollHeight;
}

async function handleSend(){
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if(!text || state.loading) return;
  const mode = state.mode;
  let proj = currentProject();
  if(!proj){ await createNewProject(); proj = currentProject(); }
  if(proj.title === 'New chat'){ proj.title = text.slice(0,40); }
  proj.messages.push({role:'user', text, type:'text'});
  state.loading = true;
  render();
  try{
    if(mode==='image'){
      const svg = await generateSvgImage(text);
      proj.messages.push({role:'ai', text:`Here's your image for "${text}":`, type:'svg', content: svg});
    } else if(mode==='video'){
      const anim = await generateAnimation(text);
      proj.messages.push({role:'ai', text:`Here's a short animated scene for "${text}":`, type:'anim', content: anim});
    } else {
      const reply = await chatWithPeacho(proj, mode==='code');
      proj.messages.push({role:'ai', text: reply, type:'text'});
    }
  }catch(e){
    console.error('Peacho handleSend error:', e);
    proj.messages.push({role:'ai', text:(e && e.message ? e.message : "Something went wrong — try again in a moment."), type:'text', isError:true});
  }
  proj.updatedAt = Date.now();
  state.loading = false;
  await saveProject(proj);
  render();
}

function buildSystemPrompt(codeMode){
  const projectTitles = state.projects.map(p=>p.title).filter(t=>t!=='New chat').slice(0,8).join(', ') || 'none yet';
  let base = `You are Peacho, an AI companion with a cultured, cool, and easy-to-understand personality — like a well-read, sharp friend who gives grounded, honest advice without corporate fluff. Be warm but concise. The user's name is ${state.user.name}. Their other projects in Peacho: ${projectTitles}. Use their name occasionally, naturally. If they ask for code, write clean, complete, working code with brief explanation.`;
  if(codeMode){ base += ' The user has switched to Code mode: prioritize writing complete, correct, well-structured code for games, websites, scripts, or apps, in a code block, with a short explanation before or after.'; }
  return base;
}

async function authHeaders(){
  const { data } = await sb.auth.getSession();
  const token = data && data.session ? data.session.access_token : null;
  if(!token){ throw new Error('Your session expired. Sign in again.'); }
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

// kind is 'chat', 'image', or 'animation'. The server uses it to enforce membership.
async function callClaude(messages, system, maxTokens, kind, attempt){
  attempt = attempt || 1;
  let response;
  try{
    response = await fetch('/api/chat', {
      method: 'POST',
      headers: await authHeaders(),
      body: JSON.stringify({ messages, system, max_tokens: maxTokens || 1000, kind: kind || 'chat' })
    });
  }catch(networkErr){
    if(networkErr && networkErr.message && networkErr.message.startsWith('Your session')) throw networkErr;
    console.error('Peacho network error:', networkErr);
    throw new Error('Could not reach Peacho. Check your internet connection.');
  }
  let data;
  try{ data = await response.json(); }
  catch(parseErr){
    console.error('Peacho parse error:', parseErr);
    throw new Error('Got a response back but could not read it. Try again.');
  }
  if(!response.ok || data.type === 'error'){
    console.error('Peacho API error:', data, 'status:', response.status);
    const isOverloaded = response.status === 529 || response.status === 429;
    if(isOverloaded && attempt < 4){
      await new Promise(r=>setTimeout(r, attempt * 1200));
      return callClaude(messages, system, maxTokens, kind, attempt + 1);
    }
    if(isOverloaded){
      throw new Error("Peacho's servers are busy right now. Try sending that again in a moment.");
    }
    const msg = (data && data.error && data.error.message) ? data.error.message : (response.statusText || 'unknown error');
    throw new Error(msg);
  }
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock){
    console.error('Peacho: no text block in response', data);
    throw new Error('No reply came back. Try again.');
  }
  return textBlock.text;
}

async function chatWithPeacho(proj, codeMode){
  const history = proj.messages.filter(m=>m.type==='text' && !m.isError).slice(-16).map(m=>({role:m.role==='ai'?'assistant':'user', content:m.text}));
  return await callClaude(history, buildSystemPrompt(codeMode), 1000, 'chat');
}

async function generateSvgImage(prompt){
  const sys = "You generate a single clean, professional SVG illustration. viewBox must be '0 0 500 500'. No external assets, no scripts. Return ONLY the raw <svg>...</svg> markup, nothing before or after it, no markdown fences, no explanation.";
  const raw = await callClaude([{role:'user', content:`Illustration to create: ${prompt}`}], sys, 1000, 'image');
  const match = raw.match(/<svg[\s\S]*<\/svg>/i);
  if(!match){ throw new Error("Couldn't draw that one. Try describing it a little differently."); }
  let svg = match[0];
  if(!/xmlns=/.test(svg.slice(0, 200))){ svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'); }
  return svg;
}

async function generateAnimation(prompt){
  const sys = "You generate a short, self-contained looping CSS animation as an HTML fragment (inline SVG and/or divs plus a <style> block using @keyframes). No external libraries, no JavaScript, must loop infinitely, must fit visually in a 320x320 area. Return ONLY the HTML fragment, nothing before or after it, no markdown fences, no explanation.";
  const raw = await callClaude([{role:'user', content:`Animated scene to create: ${prompt}`}], sys, 1000, 'animation');
  const frag = raw.replace(/```html|```/g,'').trim();
  return `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}</style></head><body>${frag}</body></html>`;
}

/* ---------------- MEMBERSHIP MODAL ---------------- */
function renderMembershipModal(){
  return `
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <h2 style="color:var(--coral-dark);margin-bottom:2px;">Upgrade Peacho</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;">Unlock image and animation generation and a higher daily message limit. Each image or animation counts as one message.</p>
      <div class="tier-grid">
        ${TIERS.map(t=>`
          <div class="tier-card ${t.id===state.selectedTier?'featured':''}" data-tier="${t.id}">
            <h3>${t.name}</h3>
            <div class="tier-price">$${t.price}<span>/mo</span></div>
            <ul>${t.features.map(f=>`<li>${f}</li>`).join('')}</ul>
            <button class="tier-select ${t.id===state.selectedTier?'chosen':''}" data-tier-btn="${t.id}">${t.id===state.selectedTier?'Selected':'Select'}</button>
          </div>`).join('')}
      </div>
      <div class="pay-note">You\u2019ll pay on Stripe\u2019s secure checkout page. It accepts credit and debit cards, plus Apple Pay and Google Pay where your device supports them. Peacho never sees your card details.</div>
      <button class="btn-primary" id="confirmSub">Subscribe for $${TIERS.find(t=>t.id===state.selectedTier).price}/mo</button>
    </div>
  </div>`;
}

function attachModalEvents(){
  document.getElementById('modalClose').onclick = ()=>{ state.showMembershipModal=false; document.getElementById('modalBg').remove(); };
  document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg'){ state.showMembershipModal=false; e.currentTarget.remove(); } });
  document.querySelectorAll('[data-tier-btn]').forEach(el=>{
    el.onclick = ()=>{ state.selectedTier = el.dataset.tierBtn; refreshModal(); };
  });
  document.querySelectorAll('.tier-card').forEach(el=>{
    el.onclick = ()=>{ state.selectedTier = el.dataset.tier; refreshModal(); };
  });
  document.querySelectorAll('[data-pay]').forEach(el=>{
    el.onclick = ()=>{ state.selectedPayment = el.dataset.pay; refreshModal(); };
  });
  document.getElementById('confirmSub').onclick = async ()=>{
    const btn = document.getElementById('confirmSub');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Opening secure checkout...';
    try{
      const resp = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: await authHeaders(),
        body: JSON.stringify({ tier: state.selectedTier })
      });
      const data = await resp.json().catch(()=>({}));
      if(!resp.ok || !data.url){ throw new Error(data.error || 'Could not start checkout.'); }
      window.location.href = data.url;
    }catch(e){
      state.toast = 'Checkout failed: ' + (e && e.message ? e.message : String(e));
      btn.disabled = false; btn.textContent = label;
      render();
    }
  };
}
function refreshModal(){ document.getElementById('modalBg').remove(); document.body.insertAdjacentHTML('beforeend', renderMembershipModal()); attachModalEvents(); }

async function handleCheckoutReturn(){
  const params = new URLSearchParams(window.location.search);
  const checkout = params.get('checkout');
  if(!checkout) return;
  window.history.replaceState({}, '', window.location.pathname);
  if(checkout === 'cancelled'){ state.toast = 'Checkout cancelled. No charge was made.'; render(); return; }
  if(checkout === 'success'){
    state.toast = 'Payment received. Your plan is updating...';
    render();
    // The plan is switched on by Stripe's webhook, which can take a few seconds.
    for(let i = 0; i < 8 && !state.user.tier; i++){
      await new Promise(r=>setTimeout(r, 1500));
      await loadProfile();
    }
    const t = TIERS.find(x=>x.id === state.user.tier);
    state.toast = t ? `You\u2019re on ${t.name}. Image and animation are unlocked.` : 'Payment received. Your plan can take a minute to show up. Refresh in a moment.';
    render();
  }
}

// Sign-in state. Supabase restores a saved session on load. With no session, we start a guest session.
let enteringApp = false;
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'SIGNED_OUT'){
    state.user = null; state.projects = []; state.currentProjectId = null;
    setTimeout(startGuest, 0);
    return;
  }
  if(!session){
    if(event === 'INITIAL_SESSION'){ setTimeout(startGuest, 0); }
    return;
  }
  const isNewUser = !state.user || state.user.id !== session.user.id;
  if((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && isNewUser && !enteringApp){
    enteringApp = true;
    // Supabase advises against awaiting its calls inside this callback, so hand off to a timer.
    setTimeout(async ()=>{
      try{
        await enterApp(session);
      }catch(e){
        console.error('Peacho sign-in error:', e);
        state.screen = 'landing';
        state.authMessage = 'Couldn\u2019t load your account. Try again.';
      }
      enteringApp = false;
      render();
      handleCheckoutReturn();
    }, 0);
  }
});
render();
